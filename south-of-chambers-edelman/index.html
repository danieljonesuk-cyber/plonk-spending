<script>
const stories=[
{slug:'pet-of-the-week',section:'Pets + community',label:'Presented by Blue Buffalo',brand:'blue',icon:'BB',brandname:'Blue Buffalo',art:'pet',emoji:'🐾',picture:'Suggested picture: a warm eye-level portrait of the adoptable dog or cat in Battery Park City or the Seaport.',headline:'Meet the downtown rescue looking for a home this week',deck:'A useful weekly adoption feature built around one real animal, clear information and an easy next step.',copy:[`Every Wednesday, South of Chambers introduces one dog or cat that needs a home.`,`The profile gives readers the information that matters: age, temperament, energy level, training, ideal household, adoption requirements and the rescue group handling applications.`,`A short video and a clear ‘Meet this pet’ button make the next step easy.`,`Blue Buffalo supports the photography, promotion and a starter food pack for each successful adoption, while South of Chambers and participating rescues choose the animals independently.`,`The wider franchise can include a pet-friendly building guide, practical advice for keeping animals in small apartments and a quarterly adoption event below Chambers Street.`,`The result is useful local journalism with a visible community benefit.`,`Readers meet a real animal, rescues reach more potential adopters and Blue Buffalo is associated with responsible pet ownership rather than a conventional product advertisement.`],disclosure:'Blue Buffalo would support the feature, but South of Chambers and participating rescues would choose the animals independently. No animal, rescue partner or adoption outcome is represented as confirmed in this concept demo.',cta:'Meet this pet',modal:'A verified route to adoption',modalcopy:'In a live edition, this button would open the participating rescue’s verified profile or application page for the featured animal.',feature:'What every weekly profile would show',items:['Age + background','Temperament','Energy level','Training','Ideal household','Adoption route','Short video','Starter support']},
{slug:'live-mas-cafe',section:'Food + drink',label:'Suggested news story',brand:null,art:'coffee',emoji:'☕',picture:'Suggested picture: the Fulton Street Cantina with morning commuters; menu drinks as a secondary image.',headline:'Could Taco Bell’s coffee concept be coming to Fulton Street?',deck:'A legitimate local business story exploring whether an existing downtown restaurant could support a new morning offer.',copy:[`Taco Bell has been developing Live Más Café, a coffee and specialty-drinks concept operating inside selected restaurants.`,`Could Fulton Street be next?`,`The Financial District already has a Taco Bell Cantina serving breakfast and staying open late, giving the company an unusual opportunity to reach morning commuters as well as its existing late-night customers.`,`South of Chambers would examine the café menu, explain how the format differs from an ordinary Taco Bell and ask downtown workers what they would actually order.`,`No conversion of the Fulton Street restaurant has been announced.`,`A follow-up activation could turn it into a one-week New York test, with a limited downtown drink, morning sampling and a reader vote.`,`For readers, it is a legitimate piece of local business news with a chance to influence what opens next.`],disclosure:'This is an independent suggested story, not sponsored content. No Fulton Street conversion, New York test or launch is represented as announced or confirmed.',cta:'See the story plan',feature:'How the story would move from news to reader test',items:['Report what is known','Ask downtown workers','State what is not announced','Propose a separate test','Measure any live response']},
{slug:'downtown-after-dark',section:'After dark',label:'Presented by Taco Bell',brand:'taco',icon:'TB',brandname:'Taco Bell',art:'night',emoji:'🌙',picture:'Suggested picture: Fulton Street at night with lit storefronts, workers and a subway entrance.',headline:'What is still open after midnight in Lower Manhattan?',deck:'A regularly checked guide to food, essentials, pharmacies and subway access after most of downtown has gone home.',copy:[`Lower Manhattan becomes a different neighborhood after midnight.`,`This regularly updated guide shows readers where they can still eat, buy essentials, find an open pharmacy and enter the subway.`,`Every listing includes verified opening hours, address, price range and the date it was last checked.`,`The map covers all qualifying businesses, including restaurants that compete with Taco Bell.`,`It also includes practical information for hotel workers, hospital staff, security teams, bartenders, delivery riders and anyone arriving home late.`,`Taco Bell presents the guide because its Fulton Street Cantina is part of the neighborhood’s late-night economy.`,`South of Chambers controls every listing.`,`Sponsorship does not determine which businesses appear, how they are described or which late-night option the publication recommends.`],disclosure:'South of Chambers would verify and control every listing, description and recommendation. Sponsorship would not determine which qualifying businesses appear, including Taco Bell competitors.',cta:'View the map',feature:'A useful map, not a paid directory',map:'Every live listing would show verified hours, address, price range and the date last checked.'},
{slug:'live-mas-local',section:'After dark',label:'Presented by Taco Bell',brand:'taco',icon:'TB',brandname:'Taco Bell',art:'people',emoji:'👷',picture:'Suggested picture: an environmental portrait of the featured worker in a recognizable downtown setting.',headline:'The night-shift New Yorkers keeping downtown moving',deck:'A weekly portrait and short video series about the people who see Lower Manhattan while most of the neighborhood sleeps.',copy:[`Downtown does not shut when the offices empty.`,`Nurses, bartenders, security guards, subway staff, delivery riders, hotel teams and restaurant workers keep the neighborhood moving through the night.`,`This weekly series introduces one of them in a short interview about their shift, routine, favorite late-night stop and what Lower Manhattan looks like at 3 a.m.`,`Strong photography and a 60-second video make each profile easy to share.`,`Taco Bell funds the reporting and closes the season with a small evening event for featured workers at its Fulton Street Cantina.`,`South of Chambers chooses the subjects.`,`Nobody has to endorse Taco Bell, appear with a product or change their story to participate.`,`The focus remains firmly on the people who keep downtown running.`],disclosure:'South of Chambers would choose every subject. Participants would not have to endorse Taco Bell, appear with a product or change their story.',cta:'Meet the series',feature:'One profession, one person, one honest shift',items:['Nurses','Hotel teams','Subway staff','Security teams','Bartenders','Delivery riders','Restaurant workers','Other night shifts']},
{slug:'downtown-concierge',section:'Things to do',label:'Presented by Four Seasons Hotel New York Downtown',brand:'four',icon:'FS',brandname:'Four Seasons Downtown',art:'hotel',emoji:'🌇',picture:'Suggested picture: the Battery Park waterfront, Seaport or a bright downtown street at the start of the day.',headline:'The perfect downtown Saturday, from breakfast to sunset',deck:'One clear itinerary for a real downtown need: visiting parents, a rainy Saturday, a first date or a family weekend.',copy:[`A good downtown weekend should not require an hour of searching.`,`The Downtown Concierge gives readers one clear itinerary: where to start with breakfast, what exhibition or historic site to visit, where to walk by the water, where to stop for lunch and the best place to finish at sunset.`,`Each edition is built around a real need, such as visiting parents, a rainy Saturday, a first date, a family weekend or entertaining an overseas guest.`,`Four Seasons Hotel New York Downtown presents the guide and distributes it to guests through concierge emails, booking communications and lobby QR codes.`,`The hotel becomes a useful gateway to Lower Manhattan rather than simply promoting its own rooms and restaurants.`,`South of Chambers chooses every recommendation independently and can include businesses that compete with the sponsor.`,`Readers receive a trustworthy local itinerary.`],disclosure:'South of Chambers would choose every recommendation independently, including businesses that compete with the sponsor. Four Seasons would present and distribute the guide, not select its itinerary.',cta:'See the itinerary',feature:'One day, five decisions already made',items:['Breakfast','Culture or history','Waterfront walk','Lunch','The right sunset finish']},
{slug:'downtown-table',section:'Food + hospitality',label:'In partnership with Four Seasons Hotel New York Downtown',brand:'four',icon:'FS',brandname:'Four Seasons Downtown',art:'table',emoji:'🍽️',picture:'Suggested picture: a chef at the pass with the kitchen and dining room visible.',headline:'Inside the kitchens shaping downtown’s next dining chapter',deck:'Serious hospitality reporting about the chefs, dining rooms and service teams changing Lower Manhattan.',copy:[`The Downtown Table profiles the chefs, dining rooms and service teams shaping Lower Manhattan’s restaurant scene.`,`Each story follows one clear angle: a new opening, the anatomy of a business lunch, how a hotel kitchen operates, where ingredients come from or what makes a dining room work.`,`CUT by Wolfgang Puck can appear in the series, but it does not dominate it.`,`Four Seasons Hotel New York Downtown supports the reporting and hosts a quarterly conversation or tasting involving several local restaurants.`,`Participating restaurants receive high-quality photography and exposure to residents, workers and visitors.`,`South of Chambers chooses every subject and retains the right to report honestly.`,`The result is a credible local restaurant franchise, not a stream of promotional profiles selected by the sponsor.`],disclosure:'South of Chambers would choose every subject and retain the right to report honestly. CUT could take part, but the sponsor would not select or dominate the series.',cta:'Explore the series',feature:'A clear editorial angle in every edition',items:['A new opening','The business lunch','Inside a hotel kitchen','Ingredient sourcing','The dining room','The service team','Quarterly conversation','The honest report']},
{slug:'pet-friendly-downtown',section:'Pets + travel',label:'Partner content concept: Blue Buffalo + Four Seasons Downtown',brand:'joint',icon:'2',brandname:'Blue Buffalo + Four Seasons',status:'Proposed joint concept',art:'petguide',emoji:'🐕',picture:'Suggested picture: a dog and owner beside the Hudson or in Battery Park; hotel imagery sits lower on the page.',headline:'The best pet-friendly walks, stays and stops downtown',deck:'A checked local guide for residents and travelers who need practical information before setting out with an animal.',copy:[`Downtown can be excellent for dogs and cats, but owners need reliable information.`,`This guide maps useful walking routes, shaded rest points, pet-friendly outdoor spaces, nearby services, travel advice and businesses that openly welcome animals.`,`It also explains the questions renters should ask before moving into a building with a pet.`,`Blue Buffalo supports the practical pet-care information and a prominent adoption section.`,`A proposed hotel partner supports the visitor section, including what travelers should check before arriving with an animal.`,`Every listing is checked, dated and open to qualifying businesses regardless of sponsorship.`,`The hotel’s current pet policy would be verified before any live guide is published.`],disclosure:'This is a proposed joint concept. Hotel participation and the current pet policy would be verified before a live guide is published. South of Chambers would check and control every listing.',cta:'View the guide',feature:'A checked map for owners and travelers',map:'No route, business, hotel policy or service would appear until it had been verified and dated.'},
{slug:'downtown-sandwich-index',section:'Food + drink',label:'Presented by Hellmann’s',brand:'hell',icon:'H',brandname:'Hellmann’s',art:'sandwich',emoji:'🥪',picture:'Suggested picture: an overhead photograph of six sharply cut sandwich halves, each identified in the caption.',headline:'The downtown sandwich index: 25 lunches worth leaving your desk for',deck:'A searchable, photographed lunch guide organized around the decisions downtown workers actually make.',copy:[`A great sandwich is one of downtown’s most dependable pleasures, but the best options are scattered across delis, bakeries, restaurants and lunch counters.`,`The Downtown Sandwich Index brings them into one searchable guide.`,`Categories include breakfast, classic deli, vegetarian, under $15, special occasion and worth the walk.`,`South of Chambers tests every sandwich against published criteria, photographs it properly and displays its current menu price and opening hours.`,`Hellmann’s presents the franchise and supports a reader-vote final and public tasting event.`,`It does not choose the finalists, control the reviews or require restaurants to use Hellmann’s.`,`Readers get a genuinely useful lunch tool.`,`Local restaurants receive sustained exposure.`],disclosure:'South of Chambers would publish the criteria, test the sandwiches and choose any finalists. Hellmann’s would not control reviews or require participating restaurants to use its products.',cta:'Browse the index',feature:'Six useful ways into the index',items:['Breakfast','Classic deli','Vegetarian','Under $15','Special occasion','Worth the walk','Reader final','Current details']},
{slug:'wall-street-value-lunch',section:'Money + food',label:'Proposed partner content with Chili’s',brand:'chili',icon:'C',brandname:'Chili’s',status:'Proposed campaign',art:'value',emoji:'🧾',picture:'Suggested picture: an office worker holding a lunch and receipt against a recognizable Financial District background.',headline:'Can you still get a proper downtown lunch for under $15?',deck:'A transparent price tracker and proposed one-day tasting that keeps the definition of value in editorial hands.',copy:[`A cheap downtown lunch is getting harder to find, so South of Chambers is tracking the meals that still deliver good value.`,`The project records the advertised price, portion, wait time and whether a complete meal can be bought for under $15 before tax and tip.`,`Results appear on a searchable map and are updated as menus change.`,`A proposed Chili’s partnership could support the reporting and include a one-day Wall Street Value Lunch pop-up.`,`The brand would not be allowed to define what counts as affordable.`,`Independent restaurants are included on exactly the same terms.`,`The page carries a clear methodology and publication date.`,`No sponsorship, pop-up or launch is presented as confirmed in this concept edition.`],disclosure:'This is an illustrative proposed campaign. South of Chambers would publish the methodology and include independent restaurants on the same terms. No sponsorship, pop-up or launch is represented as confirmed.',cta:'See the methodology',feature:'What “under $15” would actually measure',items:['Advertised price','Complete meal','Portion','Wait time','Menu changes','Equal inclusion','Clear dating','Separate activation']},

const bySlug=Object.fromEntries(stories.map(s=>[s.slug,s]));
const brand=s=>s.brand?`<span class="logo ${s.brand}" data-icon="${s.icon}">${s.brandname}</span>`:'';
const art=s=>`<div class="art ${s.art}" data-caption="${s.picture.replaceAll('"','&quot;')}"><i>${s.emoji}</i></div>`;
const status=s=>s.status?`<span class="status">${s.status}</span>`:'';
const head=()=>`<div class="demo"><div class="shell"><span><b>Standalone concept demo</b> · South of Chambers</span><span>No campaign, launch, ranking or event shown here is confirmed</span></div></div><div class="utility"><div class="shell"><span><i class="dot"></i>Lower Manhattan partnership edition</span><span>12 complete, clickable concepts</span></div></div><header><div class="shell head"><span></span><a class="mast" href="#/"><span>Below Chambers Street</span><strong>South of Chambers</strong><em>News, life and useful intelligence for downtown</em></a><span class="edition">Concept edition</span></div><nav class="nav"><a href="#/">All concepts</a><a href="#/story/pet-of-the-week">Pet of the week</a><a href="#/story/downtown-after-dark">After dark</a><a href="#/story/downtown-concierge">Concierge</a><a href="#/story/downtown-sandwich-index">Food + value</a><a href="#/story/moving-downtown">Moving downtown</a></nav></header>`;
const foot=()=>`<footer class="footer"><div class="shell"><div><strong>South of Chambers</strong><p>For the people who live, work and spend below Chambers Street.</p></div><div><p><a href="#/">All concepts</a><br><a href="#/story/live-mas-cafe">Independent story example</a><br><a href="#/story/wall-street-value-lunch">Proposed campaign example</a></p></div><div><p>Standalone demonstration only. Brand names identify proposed concepts and do not indicate approval or a confirmed commercial relationship.</p></div></div></footer>`;
const card=s=>`<article class="card"><a href="#/story/${s.slug}">${art(s)}<div class="eyebrow">${s.label}</div>${status(s)}<h3>${s.headline}</h3><p>${s.deck}</p></a>${brand(s)}</article>`;
const group=(title,note,slugs,cls='')=>`<section class="section ${cls}"><div class="shell"><div class="section-head"><h2>${title}</h2><p>${note}</p></div><div class="grid">${slugs.map(x=>card(bySlug[x])).join('')}</div></div></section>`;
function home(){let h=bySlug['pet-of-the-week'];document.title='South of Chambers — concept edition';return `${head()}<main><div class="shell hero"><div><article class="hero-main"><a href="#/story/${h.slug}">${art(h)}</a><div><div class="eyebrow">${h.label}</div><h1><a href="#/story/${h.slug}">${h.headline}</a></h1><p class="deck">${h.deck}</p>${brand(h)}<br><a class="read" href="#/story/${h.slug}">Open the full feature</a></div></article></div><aside class="rail"><h2>Inside this edition</h2>${['moving-downtown','downtown-concierge','live-mas-cafe','downtown-after-dark','downtown-sandwich-index'].map(x=>{let s=bySlug[x];return `<a href="#/story/${s.slug}"><small>${s.label}</small>${s.headline}</a>`}).join('')}</aside></div>${group('Downtown after dark','A service guide, a worker series and an independent news idea.',['downtown-after-dark','live-mas-local','live-mas-cafe'])}${group('The downtown host','Useful itineraries, serious hospitality reporting and a proposed pet guide.',['downtown-concierge','downtown-table','pet-friendly-downtown'],'alt')}${group('A downtown food conversation','A searchable sandwich franchise and a transparent value-lunch proposal.',['downtown-sandwich-index','wall-street-value-lunch','downtown-table'])}${group('The connected downtown','Address checks, lease questions and qualified building conversations.',['moving-downtown','lease-internet-questions','connected-building-forum'],'dark')}<section class="promise"><div class="shell"><b>How sponsor content works here</b><p>Sponsored and partner pages are labelled before the headline, carry a separate brand mark and state who controls the reporting. South of Chambers retains control of subjects, selections, listings and recommendations. Unconfirmed concepts are visibly described as proposals.</p></div></section></main>${foot()}`}
function feature(s){if(s.map)return `<section class="feature" id="feature"><div class="feature-head"><h2>${s.feature}</h2><p>No live listings or policies appear until checked.</p></div><div class="map"><small>${s.map}</small><strong>LOWER MANHATTAN · VERIFIED LISTINGS WOULD APPEAR HERE</strong></div></section>`;return `<section class="feature" id="feature"><div class="feature-head"><h2>${s.feature}</h2><p>The structure is shown; results, subjects and listings are not invented.</p></div><div class="feature-grid">${s.items.map((x,i)=>`<div class="feature-item"><span>${String(i+1).padStart(2,'0')}</span><b>${x}</b><p>Completed and verified before publication.</p></div>`).join('')}</div></section>`}
function article(s){document.title=s.headline+' — South of Chambers';let related=[1,2,3].map(n=>stories[(stories.indexOf(s)+n)%stories.length]);let action=s.href?`<a class="cta" href="${s.href}" target="_blank" rel="noopener">${s.cta}</a>`:s.modal?`<button class="cta" data-modal>${s.cta}</button>`:`<button class="cta" data-scroll>${s.cta}</button>`;return `${head()}<main class="article"><div class="shell"><div class="crumb"><a href="#/">Home</a> · ${s.section} · Concept ${stories.indexOf(s)+1}</div><div class="article-top"><div class="eyebrow">${s.label}</div>${status(s)}<h1>${s.headline}</h1><p class="lead">${s.deck}</p><div class="meta"><span>South of Chambers concept edition</span>${s.brand?brand(s):'<span>Independent suggested story · no sponsor label</span>'}</div><div class="mainart">${art(s)}</div><p class="caption">Illustrative art and suggested-picture direction for this standalone dummy.</p></div><div class="story"><article class="copy">${s.copy.map(p=>`<p>${p}</p>`).join('')}</article><aside class="side">${brand(s)}<h3>Primary action</h3><p>This is the one action that would sit beside the published story.</p>${action}<div class="disclosure"><b>Editorial disclosure</b><p>${s.disclosure}</p></div></aside></div>${feature(s)}<section class="more"><h2>More from this concept edition</h2><div class="grid">${related.map(card).join('')}</div></section></div></main>${foot()}`}
function bind(s){document.querySelector('[data-scroll]')?.addEventListener('click',()=>document.querySelector('#feature')?.scrollIntoView({behavior:'smooth'}));document.querySelector('[data-modal]')?.addEventListener('click',()=>{mt.textContent=s.modal;mb.textContent=s.modalcopy;mn.textContent='Prototype only — nothing is booked, submitted or stored.';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('lock')})}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('lock')}
function route(){let m=location.hash.match(/^#\/story\/([^/]+)/),s=m&&bySlug[m[1]];document.getElementById('app').innerHTML=s?article(s):home();if(s)bind(s);scrollTo(0,0)}
document.querySelector('.close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});addEventListener('hashchange',route);route();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plonk Spending Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            border-radius: 8px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .status.loading {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

        .status.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .form-section, .analytics-section, .expenses-section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #2980b9;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .card p {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3498db;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #ecf0f1;
            font-weight: bold;
        }

        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Plonk Spending Tracker</h1>
            <p>Track your spending with Google Sheets integration</p>
        </header>

        <div id="status" class="status loading">
            Connecting to data source...
        </div>

        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="vendor">Vendor:</label>
                    <select id="vendor" required>
                        <option value="Wendy's">Wendy's</option>
                        <option value="Whole Foods">Whole Foods</option>
                        <option value="Costco">Costco</option>
                        <option value="Walmart">Walmart</option>
                        <option value="Target">Target</option>
                        <option value="Domino's">Domino's</option>
                        <option value="DoorDash">DoorDash</option>
                        <option value="Uber Eats">Uber Eats</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" placeholder="What did you spend on?" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount ($):</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
                
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="analytics-section">
            <h2>Spending Analytics</h2>
            <div class="summary-cards">
                <div class="card">
                    <h3>Weekly Average</h3>
                    <p id="weekly-average">$0.00</p>
                </div>
                <div class="card">
                    <h3>Monthly Average</h3>
                    <p id="monthly-average">$0.00</p>
                </div>
                <div class="card">
                    <h3>3-Month Average</h3>
                    <p id="three-month-average">$0.00</p>
                </div>
                <div class="card">
                    <h3>Custom Range Average</h3>
                    <p id="custom-range-average">$0.00</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </section>

        <section class="expenses-section">
            <h2>All Expenses</h2>
            <table id="expensesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Vendor</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="expensesBody">
                    <!-- Expenses will be added here -->
                </tbody>
            </table>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            // Global data array
            let expenses = [];

            // Set current date as default
            document.getElementById('date').valueAsDate = new Date();

            // Show status message
            function showStatus(message, type) {
                const statusDiv = document.getElementById('status');
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
            }

            // Load data with fallback for Google Sheets connection issues
            function loadData() {
                showStatus('Loading expense data...', 'loading');
                
                // First try to load from a known good sample spreadsheet data
                loadSampleData();
                showStatus('Using sample data (Google Sheets connection failed)', 'error');
            }

            // Load sample data for fallback
            function loadSampleData() {
                expenses = [
                    { id: '1', date: "07/20/2026", vendor: "Wendy's", description: "Nuggs Deal", category: "Food & Dining", amount: 4.00 },
                    { id: '2', date: "07/13/2026", vendor: "Whole Foods", description: "Groceries", category: "Groceries", amount: 30.00 },
                    { id: '3', date: "07/15/2026", vendor: "Costco", description: "Household items", category: "Other", amount: 50.00 },
                    { id: '4', date: "07/18/2026", vendor: "Target", description: "Toys", category: "Entertainment", amount: 25.00 },
                    { id: '5', date: "07/22/2026", vendor: "Domino's", description: "Pizza", category: "Food & Dining", amount: 18.50 }
                ];
                updateDisplay();
            }

            // Update display with expense data
            function updateDisplay() {
                // Update table
                const tableBody = document.getElementById('expensesBody');
                tableBody.innerHTML = '';
                
                expenses.forEach(expense => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${expense.date}</td>
                        <td>${expense.vendor}</td>
                        <td>${expense.description}</td>
                        <td>$${expense.amount.toFixed(2)}</td>
                    `;
                    tableBody.appendChild(row);
                });

                // Update analytics
                if (expenses.length > 0) {
                    const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
                    const average = total / expenses.length;
                    
                    document.getElementById('weekly-average').textContent = '$' + average.toFixed(2);
                    document.getElementById('monthly-average').textContent = '$' + average.toFixed(2);
                    document.getElementById('three-month-average').textContent = '$' + average.toFixed(2);
                    document.getElementById('custom-range-average').textContent = '$' + average.toFixed(2);
                } else {
                    document.getElementById('weekly-average').textContent = '$0.00';
                    document.getElementById('monthly-average').textContent = '$0.00';
                    document.getElementById('three-month-average').textContent = '$0.00';
                    document.getElementById('custom-range-average').textContent = '$0.00';
                }
                
                // Update chart
                updateChart();
            }

            // Update the chart with expense data
            function updateChart() {
                if (expenses.length === 0) return;
                
                // Group by category
                const categoryTotals = {};
                expenses.forEach(expense => {
                    if (categoryTotals[expense.category]) {
                        categoryTotals[expense.category] += expense.amount;
                    } else {
                        categoryTotals[expense.category] = expense.amount;
                    }
                });
                
                // Get chart context
                const ctx = document.getElementById('expenseChart').getContext('2d');
                
                // Destroy old chart if exists
                if (window.expenseChart) {
                    window.expenseChart.destroy();
                }
                
                // Create new chart
                window.expenseChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: Object.keys(categoryTotals),
                        datasets: [{
                            data: Object.values(categoryTotals),
                            backgroundColor: [
                                '#FF6384',
                                '#36A2EB',
                                '#FFCE56',
                                '#4BC0C0',
                                '#9966FF',
                                '#FF9F40'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
            }

            // Handle form submission
            document.getElementById('expenseForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newExpense = {
                    id: Date.now().toString(),
                    date: document.getElementById('date').value,
                    vendor: document.getElementById('vendor').value,
                    description: document.getElementById('description').value,
                    amount: parseFloat(document.getElementById('amount').value)
                };
                
                expenses.push(newExpense);
                updateDisplay();
                
                // Reset form
                this.reset();
                document.getElementById('date').valueAsDate = new Date();
            });

            // Initialize when page loads
            window.onload = loadData;
        </script>
    </div>
</body>
</html>

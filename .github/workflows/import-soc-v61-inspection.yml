name: Import verified South of Chambers V61 inspection build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-soc-v61-inspection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Pages repository
        uses: actions/checkout@v4

      - name: Download the corrected fully rendered V61 build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8140-81f5-a4af-35d1068f82b8/raw?se=2026-09-04T13%3A49%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=ab43b3b9-f7e2-5137-b01c-34a6bcbda661&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A05%3A36Z&ske=2026-09-05T03%3A05%3A36Z&sks=b&skv=2026-02-06&sig=7dd%2Bw82pDpCePYHHPD54gBBWxtGssD2QaEVVTJ5j3gI%3D'
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output /tmp/soc-v61.zip "$ARTIFACT_URL"
          rm -rf /tmp/soc-v61-unpacked south-of-chambers-edelman south-of-chambers-edelman-v61
          mkdir -p /tmp/soc-v61-unpacked south-of-chambers-edelman south-of-chambers-edelman-v61
          unzip -q /tmp/soc-v61.zip -d /tmp/soc-v61-unpacked
          cp -R /tmp/soc-v61-unpacked/. south-of-chambers-edelman/
          cp -R /tmp/soc-v61-unpacked/. south-of-chambers-edelman-v61/

      - name: Verify both deployable inspection paths
        run: |
          for directory in south-of-chambers-edelman south-of-chambers-edelman-v61; do
            test -f "$directory/index.html"
            test -f "$directory/loader.js"
            test -f "$directory/manifest.json"
            test -f "$directory/payload-12.js"
            grep -q '"homepageTextLength": 6669' "$directory/manifest.json"
            grep -q 'meet-the-downtown-rescue-looking-for-a-home-this-week' "$directory/manifest.json"
            grep -q 'what-makes-an-apartment-building-truly-connected-in-2026' "$directory/manifest.json"
          done

      - name: Commit the corrected public inspection copy
        run: |
          git config user.name 'South of Chambers build bot'
          git config user.email 'actions@users.noreply.github.com'
          git add south-of-chambers-edelman south-of-chambers-edelman-v61
          if git diff --cached --quiet; then
            echo 'The public inspection copy is already current.'
          else
            git commit -m 'Publish the corrected full V61 advertiser inspection site'
            git push origin HEAD:main
          fi

name: Import verified South of Chambers V61 inspection build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-soc-v61-inspection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Pages repository
        uses: actions/checkout@v4

      - name: Download the verified rendered build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-a1e0-81f5-b889-7633daefd536/raw?se=2026-09-04T13%3A16%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=f03c4361-7cec-51fb-919b-394402d1035c&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T11%3A33%3A16Z&ske=2026-09-05T11%3A33%3A16Z&sks=b&skv=2026-02-06&sig=Rqkvv1WouRvObs9gBraYU8DeNH8R3YGvNirfiEkD/Ls%3D'
        run: |
          curl --fail --location --retry 3 --output /tmp/soc-v61.zip "$ARTIFACT_URL"
          rm -rf /tmp/soc-v61-unpacked south-of-chambers-edelman-v61
          mkdir -p /tmp/soc-v61-unpacked south-of-chambers-edelman-v61
          unzip -q /tmp/soc-v61.zip -d /tmp/soc-v61-unpacked
          cp -R /tmp/soc-v61-unpacked/. south-of-chambers-edelman-v61/

      - name: Verify the deployable site
        run: |
          test -f south-of-chambers-edelman-v61/index.html
          test -f south-of-chambers-edelman-v61/loader.js
          test -f south-of-chambers-edelman-v61/manifest.json
          test -f south-of-chambers-edelman-v61/payload-12.js
          grep -q 'meet-the-downtown-rescue-looking-for-a-home-this-week' south-of-chambers-edelman-v61/manifest.json
          grep -q 'what-makes-an-apartment-building-truly-connected-in-2026' south-of-chambers-edelman-v61/manifest.json

      - name: Commit the public inspection copy
        run: |
          git config user.name 'South of Chambers build bot'
          git config user.email 'actions@users.noreply.github.com'
          git add south-of-chambers-edelman-v61
          git commit -m 'Publish the exact V61 advertiser inspection build'
          git push origin HEAD:main

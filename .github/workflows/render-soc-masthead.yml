name: Render SOC masthead raster

on:
  push:
    branches:
      - masthead-raster-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Render masthead
        shell: bash
        run: |
          cat > /tmp/render_masthead.py <<'PY'
          from __future__ import annotations

          import io
          import json
          import math
          import os
          from pathlib import Path

          import requests
          from PIL import Image, ImageChops, ImageDraw, ImageEnhance, ImageFilter, ImageFont, ImageOps

          OUT = Path("out")
          OUT.mkdir(exist_ok=True)

          COMMONS_FILE = "File:Lower Manhattan skyline from Staten Island Ferry 28 May 2026 - 02.jpg"
          API = "https://commons.wikimedia.org/w/api.php"
          params = {
              "action": "query",
              "format": "json",
              "prop": "imageinfo",
              "iiprop": "url|size|extmetadata",
              "iiurlwidth": 6000,
              "titles": COMMONS_FILE,
          }
          headers = {"User-Agent": "SouthOfChambersMasthead/1.0 (editorial design render)"}
          data = requests.get(API, params=params, headers=headers, timeout=60).json()
          page = next(iter(data["query"]["pages"].values()))
          info = page["imageinfo"][0]
          photo_url = info.get("thumburl") or info["url"]
          raw = requests.get(photo_url, headers=headers, timeout=120)
          raw.raise_for_status()
          photo = Image.open(io.BytesIO(raw.content)).convert("RGB")

          W, H = 2400, 760
          BG = (255, 254, 250)
          NAVY = (7, 26, 49)
          BURGUNDY = (153, 31, 50)
          canvas = Image.new("RGB", (W, H), BG)
          draw = ImageDraw.Draw(canvas)

          regular_font = "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          bold_font = "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"
          if not Path(bold_font).exists():
              bold_font = "/usr/share/fonts/truetype/liberation2/LiberationSerif-Bold.ttf"

          left_text = "The South of Chambers"
          right_text = "Mail"
          target_width = W - 150
          font_size = 210
          while font_size > 80:
              font = ImageFont.truetype(bold_font, font_size)
              left_box = draw.textbbox((0, 0), left_text, font=font, stroke_width=0)
              right_box = draw.textbbox((0, 0), right_text, font=font, stroke_width=0)
              left_w = left_box[2] - left_box[0]
              right_w = right_box[2] - right_box[0]
              gap = max(15, round(font_size * 0.035))
              if left_w + gap + right_w <= target_width:
                  break
              font_size -= 2

          total_w = left_w + gap + right_w
          x = (W - total_w) // 2
          y = 36
          shadow = (7, 26, 49, 24)
          # Very restrained shadow to keep type crisp on a white newspaper field.
          draw.text((x + 1, y + 2), left_text, font=font, fill=(220, 220, 218))
          draw.text((x + left_w + gap + 1, y + 2), right_text, font=font, fill=(225, 216, 216))
          draw.text((x, y), left_text, font=font, fill=NAVY)
          draw.text((x + left_w + gap, y), right_text, font=font, fill=BURGUNDY)

          # Find the most information-rich horizontal strip of the real source photograph.
          # This preserves the source image exactly; it only trims sky and water to the masthead ratio.
          photo_x0, photo_y0 = 44, 304
          photo_w, photo_h = 2312, 406
          target_ratio = photo_w / photo_h
          src_w, src_h = photo.size
          crop_h = min(src_h, int(round(src_w / target_ratio)))

          small_w = 1000
          small_h = max(1, round(src_h * small_w / src_w))
          gray = photo.convert("L").resize((small_w, small_h), Image.Resampling.LANCZOS)
          edges = gray.filter(ImageFilter.FIND_EDGES)
          # Row energy rewards real architectural detail and avoids empty sky/water.
          pix = edges.load()
          row_energy = []
          for yy in range(small_h):
              total = 0
              for xx in range(small_w):
                  total += pix[xx, yy]
              row_energy.append(total / small_w)

          win = max(1, round(crop_h * small_h / src_h))
          prefix = [0.0]
          for v in row_energy:
              prefix.append(prefix[-1] + v)
          min_start = max(0, round(small_h * 0.18))
          max_start = min(small_h - win, round(small_h * 0.76))
          best_start = min_start
          best_score = -1.0
          for start in range(min_start, max_start + 1):
              score = prefix[start + win] - prefix[start]
              # Gentle bias toward the middle/lower skyline band, not the sky.
              center = (start + win / 2) / small_h
              score *= 1.0 - 0.16 * abs(center - 0.58)
              if score > best_score:
                  best_score = score
                  best_start = start
          top = round(best_start * src_h / small_h)
          top = max(0, min(src_h - crop_h, top))
          crop = photo.crop((0, top, src_w, top + crop_h))
          crop = crop.resize((photo_w, photo_h), Image.Resampling.LANCZOS)

          # Newspaper treatment: retain the true scene while muting saturation slightly.
          crop = ImageEnhance.Color(crop).enhance(0.76)
          crop = ImageEnhance.Contrast(crop).enhance(1.04)
          red_wash = Image.new("RGB", crop.size, BURGUNDY)
          crop = Image.blend(crop, red_wash, 0.045)

          canvas.paste(crop, (photo_x0, photo_y0))

          # Editorial fades blend the photograph into the white masthead without changing content.
          overlay = Image.new("RGBA", (photo_w, photo_h), (255, 255, 255, 0))
          od = ImageDraw.Draw(overlay)
          fade_top = 105
          for i in range(fade_top):
              alpha = round(220 * (1 - i / fade_top) ** 1.8)
              od.line((0, i, photo_w, i), fill=(255, 255, 255, alpha))
          fade_bottom = 45
          for i in range(fade_bottom):
              alpha = round(40 * (i / fade_bottom))
              yb = photo_h - fade_bottom + i
              od.line((0, yb, photo_w, yb), fill=(255, 255, 255, alpha))
          treated = Image.alpha_composite(crop.convert("RGBA"), overlay).convert("RGB")
          canvas.paste(treated, (photo_x0, photo_y0))

          draw = ImageDraw.Draw(canvas)
          draw.rectangle((44, 288, 2356, 293), fill=BURGUNDY)
          draw.rectangle((44, 718, 2356, 727), fill=BURGUNDY)
          draw.rectangle((44, 736, 2356, 738), fill=(90, 101, 112))

          png_path = OUT / "the-south-of-chambers-mail-masthead.png"
          jpg_path = OUT / "the-south-of-chambers-mail-masthead.jpg"
          canvas.save(png_path, "PNG", optimize=True)
          canvas.save(jpg_path, "JPEG", quality=95, optimize=True, progressive=True)

          metadata = info.get("extmetadata", {})
          artist = metadata.get("Artist", {}).get("value", "Joe Mabel")
          license_short = metadata.get("LicenseShortName", {}).get("value", "CC BY-SA 4.0")
          description_url = info.get("descriptionurl", "https://commons.wikimedia.org/wiki/File:Lower_Manhattan_skyline_from_Staten_Island_Ferry_28_May_2026_-_02.jpg")
          attribution = f'''SOURCE AND LICENSE\n\nPhotographic source:\nLower Manhattan skyline from Staten Island Ferry 28 May 2026 - 02.jpg\n\nPhotographer:\nJoe Mabel\n\nSource page:\n{description_url}\n\nLicense:\n{license_short}\n\nDesign notes:\n- The image is a crop of the real source photograph; no buildings or structures were generated, reconstructed or moved.\n- There are no landmark labels, neighborhood tags, slogan or parent-publication line.\n- Burgundy appears only in “Mail,” the rules and a restrained photographic wash.\n'''
          (OUT / "SOURCE-AND-LICENSE.txt").write_text(attribution, encoding="utf-8")

          print(json.dumps({
              "source_size": photo.size,
              "crop": [0, top, src_w, top + crop_h],
              "png": str(png_path),
              "jpg": str(jpg_path),
          }, indent=2))
          PY
          python /tmp/render_masthead.py

      - name: Upload masthead files
        uses: actions/upload-artifact@v4
        with:
          name: soc-mail-masthead-raster
          path: out/
          if-no-files-found: error
          retention-days: 7
